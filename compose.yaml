# Local mode (RDS_STORE=local), hardened: reachable only from this machine's
# loopback, read-only root filesystem, no capabilities, data in a named volume.
# Tokens are generated into the volume on first start: `docker compose logs api`.
services:
  api:
    build: .
    environment:
      RDS_STORE: local
      RDS_DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "8787"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - rds-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped

  # MCP over Streamable HTTP for agents on this machine: http://localhost:8788/mcp.
  # It reads the agent token from the API's tokens.json (read-only), so clients
  # need no token or env.
  mcp:
    build: .
    command: ["node", "apps/mcp/bin/rds-mcp.js", "--http"]
    environment:
      RDS_API_BASE_URL: http://api:8787
      # The local-mode API only answers loopback Host names.
      RDS_API_HOST: localhost:8787
      RDS_AGENT_TOKEN_FILE: /data/tokens.json
      RDS_MCP_HOST: 0.0.0.0
      RDS_MCP_PORT: "8788"
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - rds-data:/data:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped

volumes:
  rds-data:

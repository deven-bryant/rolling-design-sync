name: Docker

# Builds the root Dockerfile for amd64 + arm64 and pushes
# ghcr.io/<owner>/rolling-design-sync:<version> and :latest (not for a
# prerelease). Runs on v* tags; run it by hand on a tag to rebuild that
# release. See RELEASING.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name and tags
        id: meta
        env:
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          case "$REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::Run this workflow on a v* tag (got $REF)."
              exit 1
              ;;
          esac
          version="${TAG#v}"
          pkg_version=$(node -p 'require("./package.json").version')
          if [ "$pkg_version" != "$version" ]; then
            echo "::error file=package.json::version $pkg_version does not match tag $TAG"
            exit 1
          fi
          image="ghcr.io/${OWNER,,}/rolling-design-sync"
          tags="$image:$version"
          case "$version" in
            *-*) ;;
            *) tags="$tags,$image:latest" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=rolling-design-sync
            org.opencontainers.image.description=Figma to code change-sync API and portal
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=FSL-1.1-ALv2 AND Apache-2.0
          annotations: |
            index:org.opencontainers.image.description=Figma to code change-sync API and portal
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            index:org.opencontainers.image.licenses=FSL-1.1-ALv2 AND Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Bug report
description: Something doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, don't open an issue —
        follow the [security policy](https://github.com/deven-bryant/rolling-design-sync/security/policy) instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release or commit you run. Every v3 response carries the server version in the `X-RDS-Server` header.
      placeholder: "0.12.0"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - API
        - Portal
        - Figma plugin
        - MCP server
        - Agent CLI
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: store
    attributes:
      label: Store mode
      description: How the API stores its data.
      options:
        - "Local (RDS_STORE=local)"
        - "Memory (RDS_STORE=memory)"
        - "Postgres (DATABASE_URL)"
        - Not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: How you run it (Docker / plain Node and its version, OS, hosting), and the Figma client if relevant.
      placeholder: "docker compose on macOS 15; Figma desktop"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
      placeholder: |
        1. Sync a frame with the plugin
        2. `GET /v3/files/AbCdEf123456GhIjKl7890/nodes`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: What you expected to happen, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        API logs, CLI output or browser console errors. **Redact tokens, session
        secrets, connection strings and private Figma file keys** before pasting.
      render: shell

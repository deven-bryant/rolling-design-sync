name: Feature request
description: Suggest a change or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Not sure yet, or just want to talk it through? Start a thread in
        Discussions first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd like to happen. API routes, CLI commands or screens it would touch are useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other approaches you've considered.
  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - API
        - Portal
        - Figma plugin
        - MCP server
        - Agent CLI
        - Other / not sure
